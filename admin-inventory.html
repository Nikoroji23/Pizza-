<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory | Anti-Crust Pizza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- navbar is inserted here by js/layout.js -->
  <div id="navbar"></div>

  <main>

    <div class="container page">
      <div class="page-head">
        <div>
          <span class="admin-chip">🛡️ Admin</span>
          <h1 class="page-title" style="margin-top:8px">Inventory &amp; Stock</h1>
          <p class="page-sub">Changes show up instantly in the customer pizza builder.</p>
        </div>
        <button class="btn btn-audit" id="audit-btn" type="button">🔍 Run Stock Audit</button>
      </div>

      <div class="banner banner-warning" id="low-warning" hidden>
        <div><b>⚠️ Low stock warning</b><span id="low-warning-text"></span></div>
        <button class="btn btn-sm btn-outline" id="show-low" type="button">View them</button>
      </div>
      <div id="audit-result" hidden></div>

      <div class="row-between" style="flex-wrap:wrap">
        <div class="tabs" id="inv-tabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="base">Bases</button>
          <button class="tab" data-filter="sauce">Sauces</button>
          <button class="tab" data-filter="cheese">Cheeses</button>
          <button class="tab" data-filter="vegetable">Vegetables</button>
          <button class="tab" data-filter="low">⚠ Low stock</button>
        </div>
        <label class="search"><span>🔎</span><input class="input" id="inv-search" placeholder="Search ingredients…"></label>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead><tr><th>Ingredient</th><th>Category</th><th>Price</th><th>Stock</th><th>Alert at</th><th style="text-align:right">Actions</th></tr></thead>
            <tbody id="inv-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- edit pop-up -->
    <div class="modal-backdrop" id="edit-modal" hidden>
      <form class="modal modal-simple" id="edit-form">
        <div class="modal-simple-head">
          <div><h3 id="edit-title">Edit item</h3><p>Update stock, alert level or price.</p></div>
          <button class="close-btn" id="edit-close" type="button">✕</button>
        </div>
        <label class="field"><span class="label">Stock quantity</span><input class="input" id="edit-stock" type="number" min="0" required></label>
        <label class="field"><span class="label">Low-stock alert threshold</span><input class="input" id="edit-threshold" type="number" min="0" required><span class="hint">Warn when stock falls to this number.</span></label>
        <label class="field"><span class="label">Price (₱)</span><input class="input" id="edit-price" type="number" min="0" required></label>
        <div class="row" style="justify-content:flex-end">
          <button class="btn btn-outline" id="edit-cancel" type="button">Cancel</button>
          <button class="btn btn-solid" type="submit">Save</button>
        </div>
      </form>
    </div>

  </main>

  <!-- footer is inserted here by js/layout.js -->
  <div id="footer"></div>

  <!-- Scripts: order matters! Each file uses the ones loaded before it. -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/admin-inventory.js"></script>
</body>
</html>
