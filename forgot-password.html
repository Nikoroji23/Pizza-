<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Anti-Crust Pizza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- navbar is inserted here by js/layout.js -->
  <div id="navbar"></div>

  <main>

    <div class="narrow">
      <div class="auth-head">
        <div class="auth-icon amber">🔑</div>
        <h1>Reset your password</h1>
        <p>No email server in this demo, so you can reset it right here</p>
      </div>

      <div class="card auth-card" id="step-email">
        <form id="email-form">
          <div class="alert alert-error" id="email-error" hidden></div>
          <label class="field"><span class="label">Account email</span>
            <div class="input-icon"><span>✉️</span><input class="input" id="fp-email" type="email" required></div>
          </label>
          <button class="btn btn-primary btn-block btn-submit" type="submit">Continue</button>
        </form>
        <p class="auth-foot"><a class="link" href="login.html">← Back to login</a></p>
      </div>

      <div class="card auth-card" id="step-reset" hidden>
        <p class="muted small">Choose a new password for <b id="reset-for"></b></p>
        <form id="reset-form">
          <div class="alert alert-error" id="reset-error" hidden></div>
          <label class="field"><span class="label">New password</span><input class="input" id="new-password" type="password" minlength="6" required autocomplete="new-password"></label>
          <label class="field"><span class="label">Confirm new password</span><input class="input" id="new-confirm" type="password" minlength="6" required autocomplete="new-password"></label>
          <button class="btn btn-primary btn-block btn-submit" type="submit">Update Password</button>
        </form>
      </div>

      <div class="card auth-card center" id="step-done" hidden>
        <div class="success-icon" style="margin:0 auto">✅</div>
        <h2>Password updated</h2>
        <p class="muted small">You can now log in with your new password.</p>
        <a class="btn btn-primary btn-block btn-submit" href="login.html">Go to Login</a>
      </div>
    </div>

  </main>

  <!-- footer is inserted here by js/layout.js -->
  <div id="footer"></div>

  <!-- Scripts: order matters! Each file uses the ones loaded before it. -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/forgot-password.js"></script>
</body>
</html>
