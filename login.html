<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Anti-Crust Pizza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- navbar is inserted here by js/layout.js -->
  <div id="navbar"></div>

  <main>

    <div class="narrow">
      <div class="auth-head">
        <div class="auth-icon">🍕</div>
        <h1>Welcome back</h1>
        <p>Log in to order and track your pizzas</p>
      </div>
      <div class="card auth-card">
        <div class="demo-box">
          <b>Demo account:</b> user@anticrust.com / User@12345<br>
          <button type="button" id="fill-demo">Fill it in for me</button>
        </div>
        <form id="login-form">
          <div class="alert alert-error" id="login-error" hidden></div>
          <label class="field"><span class="label">Email</span>
            <div class="input-icon"><span>✉️</span><input class="input" id="email" type="email" required autocomplete="username"></div>
          </label>
          <div>
            <div class="row-label"><span class="label">Password</span><a href="forgot-password.html">Forgot password?</a></div>
            <div class="input-icon"><span>🔒</span><input class="input" id="password" type="password" required autocomplete="current-password"></div>
          </div>
          <button class="btn btn-primary btn-block btn-submit" type="submit">Log In</button>
        </form>
        <p class="auth-foot">New here? <a class="link" href="register.html">Create an account</a></p>
      </div>
    </div>

  </main>

  <!-- footer is inserted here by js/layout.js -->
  <div id="footer"></div>

  <!-- Scripts: order matters! Each file uses the ones loaded before it. -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
